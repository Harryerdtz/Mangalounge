      <stop offset="1" stop-color="#D9A038"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#3A0C07" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="46" height="46" rx="13" fill="url(#bg)"/>
  <rect x="1" y="1" width="46" height="46" rx="13" fill="url(#gloss)"/>

  <!-- aufgeschlagenes Buch -->
