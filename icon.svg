    <linearGradient id="page" x1="12" y1="16" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDFA"/>
      <stop offset="1" stop-color="#E6D6C4"/>
    </linearGradient>
    <linearGradient id="gold" x1="31" y1="26" x2="41" y2="37" gradientUnits="userSpaceOnUse">
