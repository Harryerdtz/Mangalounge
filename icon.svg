<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="4" y1="1" x2="44" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EE7B58"/>
      <stop offset="0.42" stop-color="#BC4130"/>
      <stop offset="1" stop-color="#5C1912"/>
    </linearGradient>
    <linearGradient id="gloss" x1="24" y1="2" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
