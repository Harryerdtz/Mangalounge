  </g>

  <!-- Buchruecken -->
  <path d="M24 19.2v16.4" stroke="#C6A78F" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Textzeilen -->
  <g stroke="#CFBBA8" stroke-width="1.2" stroke-linecap="round">
    <path d="M14.6 24.2h6.1"/>
    <path d="M14.6 28.2h4.8"/>
